name: PocketNX
options:
  bundleIdPrefix: com.pocketnx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptySchemes: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  PocketNX:
    type: application
    platform: iOS
    sources:
      - path: iOS/PocketNX
      - path: Core/src
      - path: demo/hello_counter.nro
        type: resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketnx.app
        PRODUCT_NAME: PocketNX
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/iOS/PocketNX/Support/PocketNX-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Core/src"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_ENABLE_OBJC_ARC: "YES"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    frameworks:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
    info:
      path: iOS/PocketNX/Info.plist
      properties:
        CFBundleDisplayName: PocketNX
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: "APPL"
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  PocketNX:
    build:
      targets:
        PocketNX: all
    run:
      config: Debug
